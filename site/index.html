<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="按用途发现 GitHub 上热门的 Codex skills。">
    <title>分类总览 · Codex Skill Radar</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Codex Skill Radar 首页">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span><strong>Codex Skill Radar</strong><small>GitHub skill index</small></span>
      </a>
      <nav class="topnav" aria-label="主要导航">
        <a class="active" href="./index.html">分类总览</a>
        <a href="./catalog.html">完整目录</a>
        <a href="https://github.com/wujiaze16-lgtm/codex-skill-radar" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <main class="summary-main">
      <section class="workspace-head summary-head" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">SKILL MAP</p>
          <h1 id="pageTitle">按用途找到合适的 Skill</h1>
          <p class="lead">从开发、研究、内容到自动化，先选择你要解决的问题，再比较具体工具。</p>
        </div>
        <form id="summarySearch" class="search-field" action="./catalog.html">
          <label class="sr-only" for="summarySearchInput">搜索 skills</label>
          <input id="summarySearchInput" name="q" type="search" placeholder="直接搜索能力、仓库或标签" autocomplete="off">
          <button class="search-submit" type="submit">搜索</button>
        </form>
      </section>

      <section class="metrics summary-metrics" aria-label="目录统计">
        <div><span>收录 Skills</span><strong id="skillCount">0</strong></div>
        <div><span>GitHub 仓库</span><strong id="repoCount">0</strong></div>
        <div><span>用途类别</span><strong id="categoryCount">0</strong></div>
        <div><span>90 天内活跃</span><strong id="activeCount">0</strong></div>
      </section>

      <section class="category-section" aria-labelledby="categoryTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">BROWSE BY OUTCOME</p>
            <h2 id="categoryTitle">这些 Skills 能帮你做什么</h2>
          </div>
          <a class="text-link" href="./catalog.html">查看全部 Skills <span aria-hidden="true">→</span></a>
        </div>
        <div id="summaryStatus" class="status-message" role="status">正在读取分类...</div>
        <div id="categoryGrid" class="category-grid"></div>
      </section>

      <section class="popular-section" aria-labelledby="popularTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">TRENDING NOW</p>
            <h2 id="popularTitle">当前热门</h2>
          </div>
          <span id="updatedAt" class="updated">正在加载目录</span>
        </div>
        <div id="popularList" class="popular-list"></div>
      </section>
    </main>
    <script src="./summary-app.js" defer></script>
  </body>
</html>
